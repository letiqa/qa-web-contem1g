name: QA Automation - Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}
  schedule:
    # Roda automaticamente todo dia às 06h (horário UTC)
    - cron: '0 6 * * *'

jobs:
  test:
    name: Run Playwright test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pytest playwright pytest-html; fi

      - name: Instalar browsers do Playwright
        run: python -m playwright install --with-deps chromium

      - name: Executar testes
        run: |
          pytest tests/ \
            --html=report.html \
            --self-contained-html \
            -v

      - name: Upload do relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: report.html
          retention-days: 15

      - name: Upload de screenshots/traces em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            test-results/
            screenshots/
          retention-days: 15
          if-no-files-found: ignore
